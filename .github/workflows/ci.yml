name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest -q tests > pytest-output.log 2>&1
          status=$?
          cat pytest-output.log
          if [ "$status" -ne 0 ]; then
            tail -n 40 pytest-output.log | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do
              echo "::error title=pytest::$line"
            done
          fi
          exit "$status"

  contract-compile:
    name: Compile Solidity contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install tooling
        shell: bash
        run: |
          set +e
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock > npm-output.log 2>&1
          status=$?
          cat npm-output.log
          if [ "$status" -ne 0 ]; then
            tail -n 40 npm-output.log | sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do
              echo "::error title=npm::$line"
            done
          fi
          exit "$status"
      - name: Compile
        run: npm run compile
